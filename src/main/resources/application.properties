!-- Conection to DB
spring.application.name=astroPI
spring.datasource.url=jdbc:postgresql://localhost:5432/astroPI_DB
spring.datasource.username=postgres
spring.datasource.password=astroAdminDB

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Rechaza campos JSON que no existan en el DTO recibido.
spring.jackson.deserialization.fail-on-unknown-properties=true

# Configuracion JWT.
# La clave debe tener longitud suficiente para HS384/HS512.
app.jwt.secret=astropi_super_secret_key_very_secure_2026_1234567890
app.jwt.expiration-ms=86400000

# Origenes permitidos para el futuro frontend React.
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

!Spring Security add Login - protect endpoints
spring.security.user.name=admin
spring.security.user.password=admin
