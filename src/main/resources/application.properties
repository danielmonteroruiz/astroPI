spring.application.name=astroPI

# Base de datos PostgreSQL.
spring.datasource.url=jdbc:postgresql://localhost:5432/astroPI_DB
spring.datasource.username=postgres
spring.datasource.password=astroAdminDB

# JPA solo valida el esquema. Las migraciones las gestiona Flyway.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Migraciones de base de datos.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Rechaza campos JSON que no existan en el DTO recibido.
spring.jackson.deserialization.fail-on-unknown-properties=true

# Configuracion JWT.
# La clave debe tener longitud suficiente para HS384/HS512.
app.jwt.secret=astropi_super_secret_key_very_secure_2026_1234567890
app.jwt.expiration-ms=86400000

# Origenes permitidos para el futuro frontend React.
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:4173,http://127.0.0.1:4173

# Recuperacion de password.
app.password-reset.token-expiration-minutes=15
app.password-reset.frontend-url=http://127.0.0.1:4173/reset-password

# Correo saliente.
# Configuralo por variables de entorno para no guardar secretos en el repo.
app.mail.enabled=${APP_MAIL_ENABLED:false}
app.mail.from=${APP_MAIL_FROM:no-reply@astropi.local}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
